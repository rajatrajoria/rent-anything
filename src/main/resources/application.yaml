spring:
  application:
    name: rent-anything
  datasource:
    url: ${NEONDB_URL}
    username: ${NEONDB_USERNAME}
    password: ${NEONDB_PASSWORD}
  flyway:
    clean-on-validation-error: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 55MB

jwt:
  secret:
    key: ${JWT_SECRET_KEY}
  access-token:
    expiration: 3600000
  refresh-token:
    expiration-days: 7
  email:
    verification:
      expiration-minutes: 5
  password:
    reset:
      expiration-minutes: 15

booking:
  expiration:
    fixed-rate: 60000
    timeout-minutes: 10
  completion:
    fixed-rate: 60000

app:
  email:
    provider: gmail
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

minio:
  # Works against any S3-compatible provider, not just self-hosted MinIO -
  # e.g. Cloudflare R2: endpoint = https://<account_id>.r2.cloudflarestorage.com,
  # region = auto, access-key/secret-key = an R2 API token's key pair.
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  region: ${MINIO_REGION:us-east-1}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET_NAME:rent-anything}
